[package]
name = "keeper"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time", "signal", "fs"] }
futures-util = "0.3.32"
yellowstone-grpc-client = "17.0.0"
yellowstone-grpc-proto = "14.0.1"
tonic = { version = "0.14.6", features = ["tls-ring"] }
lastbuy-sdk = { version = "0.3.1", default-features = false, features = ["accounts", "instructions"] }
solana-pubkey = { version = "4.4.0", features = ["borsh"] }
solana-signature = "3.6.0"
solana-instruction = "3.5.1"
solana-rpc-client = "4.4.1"
solana-transaction = { version = "5.1.0", features = ["wincode", "verify"] }
solana-message = "5.1.0"
solana-keypair = "4.0.1"
solana-hash = "4.6.0"
solana-signer = "4.0.0"
spl-associated-token-account-interface = "2.0.0"
borsh = "1.8.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.9"
clap = { version = "4.6", features = ["derive"] }
url = "2.5"
thiserror = "2.0.21"
log = "0.4.34"
env_logger = "0.11.11"

solana-transaction-status-client-types = "4.4.1"
wincode = "0.6.3"

solana-rpc-client-types = "4.4.1"
solana-commitment-config = "3.1.1"

[dev-dependencies]
bs58 = "0.5.1"

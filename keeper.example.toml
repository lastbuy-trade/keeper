keypair_path = "~/.config/solana/id.json"
# Secrets and provider endpoints belong in keeper.secrets.toml.
# Full getProgramAccounts reconciliation interval; account changes arrive via Yellowstone.
gpa_interval_seconds = 300
# Stop retrying a curve after this many failed executions.
max_curve_failures = 3
